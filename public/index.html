<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>ESP32 Dashboard</title>
  <link rel="stylesheet" href="styles.css">
  <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.8/dist/css/bootstrap.min.css" rel="stylesheet" integrity="sha384-sRIl4kxILFvY47J16cr9ZwB07vP4J8+LH7qKQnuqkuIAvNWLzeN8tE5YBujZqJLB" crossorigin="anonymous">
</head>
<body>
  <header>
    <h1>ESP32 Firebase Dashboard</h1>
    <div id="connection-status" class="disconnected">Connecting...</div>
  </header>

  <main class="dashboard">
    <div class="card">
      <h2>Light Sensor (LDR)</h2>
      <div class="gauge-container">
        <svg class="gauge" viewBox="0 0 200 120">
          <path class="gauge-bg" d="M20,100 A80,80 0 0,1 180,100" />
          <path id="gauge-fill" class="gauge-fill" d="M20,100 A80,80 0 0,1 180,100" />
        </svg>
        <div class="gauge-value" id="ldr-value">--</div>
      </div>
      <div class="sensor-detail">
        <span>Voltage: <strong id="voltage-value">--</strong> mV</span>
      </div>
    </div>

    <div class="card">
      <h2>Physical Switch</h2>
      <div class="switch-indicator-container">
        <div id="switch-indicator" class="switch-indicator off">
          <span id="switch-label">OFF</span>
        </div>
      </div>
    </div>

    <div class="card">
      <h2>LED Digital (Pin 12)</h2>
      <div class="toggle-container">
        <label class="toggle">
          <input type="checkbox" id="led-digital-toggle">
          <span class="toggle-slider"></span>
        </label>
        <span id="led-digital-label" class="control-label">OFF</span>
      </div>
    </div>

    <div class="card">
      <h2>LED Brightness (Pin 14)</h2>
      <div class="slider-container">
        <input type="range" id="led-analog-slider" min="0" max="255" value="0">
        <span id="led-analog-value" class="slider-value">0</span>
      </div>
      <div class="slider-labels">
        <span>0</span><span>255</span>
      </div>
    </div>

    <div class="card">
      <h2>Servo Motor</h2>
      <div class="slider-container">
        <input type="range" id="servo-slider" min="0" max="180" value="90">
        <span id="servo-value" class="slider-value">90°</span>
      </div>
      <div class="slider-labels">
        <span>0°</span><span>180°</span>
      </div>

    </div>
  </main>

  <script type="module" src="app.js"></script>
</body>
</html>
