<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>ESP32 Dashboard</title>
  <link rel="stylesheet" href="styles.css">
  <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.8/dist/css/bootstrap.min.css" rel="stylesheet" integrity="sha384-sRIl4kxILFvY47J16cr9ZwB07vP4J8+LH7qKQnuqkuIAvNWLzeN8tE5YBujZqJLB" crossorigin="anonymous">
  <script src="https://cdn.jsdelivr.net/npm/chart.js@4/dist/chart.umd.min.js"></script>
</head>
<body>
  <header>
    <h1>KatEye MPU6050 Collect </h1>
    <div id="connection-status" class="disconnected">Connecting LOL...</div>
  </header>

  <main class="dashboard">
    <div class="card">
      <h2>Calibration</h2>
      <div class="calibration-data">
        <div class="cal-row"><span>bias_ax</span> <strong id="cal-bias-ax">--</strong></div>
        <div class="cal-row"><span>bias_ay</span> <strong id="cal-bias-ay">--</strong></div>
        <div class="cal-row"><span>bias_az</span> <strong id="cal-bias-az">--</strong></div>
        <div class="cal-row"><span>bias_gx</span> <strong id="cal-bias-gx">--</strong></div>
        <div class="cal-row"><span>bias_gy</span> <strong id="cal-bias-gy">--</strong></div>
        <div class="cal-row"><span>bias_gz</span> <strong id="cal-bias-gz">--</strong></div>
      </div>
    </div>

    <div class="card">
      <h2>Data Collection</h2>
      <div id="collect-status" class="collect-status">Idle</div>
      <div class="btn-grid">
        <button data-label="0" data-name="Accelerate">Accelerate</button>
        <button data-label="7" data-name="Left">Left</button>
        <button data-label="8" data-name="Right">Right</button>
        <button data-label="5" data-name="Brake">Brake</button>
        <button data-label="1" data-name="Aggressive Accelerate">Agg Accel</button>
        <button data-label="3" data-name="Aggressive Left">Agg Left</button>
        <button data-label="4" data-name="Aggressive Right">Agg Right</button>
        <button data-label="2" data-name="Aggressive Brake">Agg Brake</button>
        <button data-label="6" data-name="Idling">Idling</button>
      </div>
    </div>

    <div class="card">
      <h2>Recordings</h2>
      <div id="recordings-list" class="recordings-scroll"></div>
    </div>


    <div class="card card-wide" id="graph-card" style="display:none;">
      <h2>Recording Data</h2>
      <div id="graph-meta" class="graph-meta"></div>
      <canvas id="recording-chart"></canvas>
    </div>
  </main>

  <script type="module" src="src/app.js"></script>
</body>
</html>
