<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>ESP32 Dashboard</title>
  <link rel="stylesheet" href="styles.css">
  <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.8/dist/css/bootstrap.min.css" rel="stylesheet" integrity="sha384-sRIl4kxILFvY47J16cr9ZwB07vP4J8+LH7qKQnuqkuIAvNWLzeN8tE5YBujZqJLB" crossorigin="anonymous">
  <script src="https://cdn.jsdelivr.net/npm/chart.js@4/dist/chart.umd.min.js"></script>
</head>
<body>
  <header>
    <h1>ESP32 Firebase Dashboard</h1>
    <div id="connection-status" class="disconnected">Connecting...</div>
  </header>

  <main class="dashboard">
    <div class="card">
      <h2>IMU Sensor</h2>
      <div class="imu-data">
        <div class="imu-section">
          <h3>Accelerometer</h3>
          <div class="imu-row"><span class="imu-axis">X</span> <strong id="accel-x">--</strong></div>
          <div class="imu-row"><span class="imu-axis">Y</span> <strong id="accel-y">--</strong></div>
          <div class="imu-row"><span class="imu-axis">Z</span> <strong id="accel-z">--</strong></div>
        </div>
        <div class="imu-section">
          <h3>Gyroscope</h3>
          <div class="imu-row"><span class="imu-axis">X</span> <strong id="gyro-x">--</strong></div>
          <div class="imu-row"><span class="imu-axis">Y</span> <strong id="gyro-y">--</strong></div>
          <div class="imu-row"><span class="imu-axis">Z</span> <strong id="gyro-z">--</strong></div>
        </div>
      </div>
    </div>

    <div class="card">
      <h2>Data Collection</h2>
      <div id="collect-status" class="collect-status">Idle</div>
      <div class="btn-grid">
        <button data-label="0" data-name="Accelerate">Accelerate</button>
        <button data-label="7" data-name="Left">Left</button>
        <button data-label="8" data-name="Right">Right</button>
        <button data-label="5" data-name="Brake">Brake</button>
        <button data-label="1" data-name="Aggressive Accelerate">Agg Accel</button>
        <button data-label="3" data-name="Aggressive Left">Agg Left</button>
        <button data-label="4" data-name="Aggressive Right">Agg Right</button>
        <button data-label="2" data-name="Aggressive Brake">Agg Brake</button>
        <button data-label="6" data-name="Idling">Idling</button>
      </div>
    </div>

    <div class="card">
      <h2>Device Status</h2>
      <div class="device-stats">
        <div class="stat-item">
          <span class="stat-label">Countdown</span>
          <span id="countdown-value" class="stat-value">--</span>
        </div>
        <div class="stat-item">
          <span class="stat-label">Progress</span>
          <div class="progress-bar-container">
            <div id="progress-bar" class="progress-bar"></div>
          </div>
          <span id="progress-value" class="stat-value">0 / 560</span>
        </div>
        <div class="stat-item">
          <span class="stat-label">Last Error</span>
          <span id="error-value" class="stat-value error-text">--</span>
        </div>
      </div>
    </div>


    <div class="card card-wide" id="graph-card" style="display:none;">
      <h2>Recording Data</h2>
      <div id="graph-meta" class="graph-meta"></div>
      <canvas id="recording-chart"></canvas>
    </div>
  </main>

  <script type="module" src="src/app.js"></script>
</body>
</html>
